name: OmniBrain CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: CI (Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify DB Initialization
        run: python backend/init_db.py

      - name: Prepare Test Data (Generate Dummy PDF)
        run: |
          pip install reportlab
          python tests/generate_test_pdf.py

      - name: Run E2E Tests (Playwright/Mocked)
        run: |
          pip install playwright httpx
          playwright install --with-deps chromium
          # Start the backend API server in the background
          uvicorn backend.api:app --host 0.0.0.0 --port 8000 &
          # Wait for backend to boot up
          sleep 3
          # Start the frontend dev server in the background for Playwright to hit
          cd frontend && npm run dev &
          # Wait for Vite to boot up
          sleep 5
          python tests/test_e2e.py

  deploy:
    name: CD (Deploy to Cloud Run)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'omnibrain'
          region: 'us-central1'
          source: '.'
          flags: |
            --min-instances=1
            --max-instances=1
            --allow-unauthenticated
          env_vars: |
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
